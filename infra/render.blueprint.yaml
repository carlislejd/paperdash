# Paperdash production topology. Keep identical to infra/render.blueprint.yaml (CI checks this).
# $300/month fixed INCLUDING the separately selected $25 Pro workspace.
# Egress, external archives, taxes and optional future chain RPC cost extra.
# Oregon is provisional: benchmark upstream/audience latency before creation.
# Initial deploy uses the managed database owner for idempotent schema bootstrap.
# Before public launch, follow docs/OPERATIONS.md to restrict runtime DB roles.
# This file creates no infrastructure until a Blueprint is explicitly deployed.
previews:
  generation: "off"

services:
  - type: web
    name: paperdash-web
    runtime: static
    repo: https://github.com/carlislejd/paperdash
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: apps/web/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        fromService:
          name: paperdash-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: paperdash-api
    runtime: node
    repo: https://github.com/carlislejd/paperdash
    region: oregon
    plan: 1c-2g
    numInstances: 2
    buildCommand: npm ci --include=dev && npm run build:api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:api
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: EMBEDDED_COLLECTOR
        value: "false"
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: paperdash-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: paperdash-cache
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          name: paperdash-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: UPSTREAM_ORIGIN
        value: https://exchange.papertrade.xyz

  - type: worker
    name: paperdash-ingest
    runtime: node
    repo: https://github.com/carlislejd/paperdash
    region: oregon
    plan: 1c-2g
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build:ingest
    startCommand: npm run start:ingest
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: paperdash-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: paperdash-cache
          type: keyvalue
          property: connectionString
      - key: UPSTREAM_ORIGIN
        value: https://exchange.papertrade.xyz
      - key: STREAM_URL
        value: wss://stream.papertrade.xyz/connection/websocket
      - key: SUMMARY_INTERVAL_MS
        value: "2000"
      - key: RECENT_INTERVAL_MS
        value: "10000"
      - key: DIRECTORY_INTERVAL_MS
        value: "30000"
      - key: HISTORY_INTERVAL_MS
        value: "60000"

  - type: keyvalue
    name: paperdash-cache
    region: oregon
    plan: 1g
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: paperdash-db
    region: oregon
    plan: 2c-4g
    postgresMajorVersion: "18"
    diskSizeGB: 50
    storageAutoscalingEnabled: false
    highAvailability:
      enabled: true
    ipAllowList: []
