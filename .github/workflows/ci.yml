name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: paperdash_test
          POSTGRES_PASSWORD: paperdash_test
          POSTGRES_DB: paperdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperdash_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://paperdash_test:paperdash_test@127.0.0.1:5432/paperdash_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Ensure PostgreSQL client for the private migration job test
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - run: npm test
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser flows
        run: npm run test:e2e
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m unittest discover -s tests
      - name: Validate Render Blueprint schema and mirror
        run: |
          python -m pip install pyyaml==6.0.3 jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          import yaml

          root = Path('render.yaml')
          mirror = Path('infra/render.blueprint.yaml')
          assert root.read_bytes() == mirror.read_bytes(), 'Render Blueprint copies differ'
          schema = json.loads(Path('research/sources/dashboard-2026-10-09/render.yaml.json').read_text())
          jsonschema.validate(yaml.safe_load(root.read_text()), schema)
          print('Blueprint schema and mirror validated')
          PY
