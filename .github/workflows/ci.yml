name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile browser flows
        run: npm run test:e2e
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: python -m unittest discover -s tests
      - name: Validate Render Blueprint schema and mirror
        run: |
          python -m pip install pyyaml==6.0.3 jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          import yaml

          root = Path('render.yaml')
          mirror = Path('infra/render.blueprint.yaml')
          assert root.read_bytes() == mirror.read_bytes(), 'Render Blueprint copies differ'
          schema = json.loads(Path('research/sources/dashboard-2026-10-09/render.yaml.json').read_text())
          jsonschema.validate(yaml.safe_load(root.read_text()), schema)
          print('Blueprint schema and mirror validated')
          PY
